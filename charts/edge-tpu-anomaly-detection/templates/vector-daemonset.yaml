{{- if .Values.vector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "edge-tpu-anomaly-detection.fullname" . }}-vector
  labels:
    {{- include "edge-tpu-anomaly-detection.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-pipeline
spec:
  selector:
    matchLabels:
      {{- include "edge-tpu-anomaly-detection.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: telemetry-pipeline
  template:
    metadata:
      labels:
        {{- include "edge-tpu-anomaly-detection.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: telemetry-pipeline
    spec:
      serviceAccountName: {{ include "edge-tpu-anomaly-detection.fullname" . }}-vector
      terminationGracePeriodSeconds: 15
      containers:
        - name: vector
          image: "{{ .Values.vector.image.repository }}:{{ .Values.vector.image.tag }}"
          imagePullPolicy: {{ .Values.vector.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/vector/vector.yaml"
          env:
            - name: VECTOR_LOG
              value: "info"
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 514
              protocol: TCP
            - name: netflow-udp
              containerPort: 2055
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              {{- toYaml .Values.vector.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.vector.resources.limits | nindent 14 }}
          volumeMounts:
            - name: config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            {{- if .Values.vector.auditLogs.enabled }}
            - name: var-log-audit
              mountPath: {{ .Values.vector.auditLogs.hostPath }}
              readOnly: true
            {{- end }}
            - name: var-log-pods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "edge-tpu-anomaly-detection.fullname" . }}-vector-config
        - name: data
          emptyDir: {}
        {{- if .Values.vector.auditLogs.enabled }}
        - name: var-log-audit
          hostPath:
            path: {{ .Values.vector.auditLogs.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        - name: var-log-pods
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "edge-tpu-anomaly-detection.fullname" . }}-vector
  labels:
    {{- include "edge-tpu-anomaly-detection.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "edge-tpu-anomaly-detection.fullname" . }}-vector-reader
  labels:
    {{- include "edge-tpu-anomaly-detection.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "edge-tpu-anomaly-detection.fullname" . }}-vector-reader-binding
  labels:
    {{- include "edge-tpu-anomaly-detection.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "edge-tpu-anomaly-detection.fullname" . }}-vector-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "edge-tpu-anomaly-detection.fullname" . }}-vector
    namespace: {{ .Release.Namespace }}
{{- end }}
