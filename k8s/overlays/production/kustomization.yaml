apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: anomaly-detection

resources:
  - ../../base

patches:
  - path: patches/inference-device-passthrough.yaml
    target:
      kind: Deployment
      name: edge-tpu-inference

images:
  - name: localhost/edge-tpu-inference
    newName: localhost/edge-tpu-inference
    newTag: latest
