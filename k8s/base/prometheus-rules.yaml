apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: edge-tpu-anomaly-rules
  namespace: anomaly-detection
  labels:
    app.kubernetes.io/name: edge-tpu-inference
    role: alert-rules
spec:
  groups:
    - name: edge_tpu_anomaly_alerts
      rules:
        # Alert 1: Reconstruction Error Exceeds Calibrated Baseline Threshold for 3 consecutive windows (30s)
        - alert: HighNetworkAnomalyScore
          expr: anomaly_reconstruction_error_mse > 0.045
          for: 30s
          labels:
            severity: critical
            pipeline: edge-tpu-anomaly-detection
          annotations:
            summary: "High Network/Cluster Anomaly Score Detected on Edge TPU"
            description: "The autoencoder reconstruction error (MSE = {{ $value | printf \"%.5f\" }}) has exceeded the baseline anomaly threshold for >30 seconds. Injected intrusion, port scan, or lateral movement detected."
            runbook_url: "https://wiki.internal.net/runbooks/network-anomaly"

        # Alert 2: Coral TPU Disconnected / Fallback Mode Active
        - alert: EdgeTpuDeviceDisconnected
          expr: edge_tpu_device_status == 0
          for: 1m
          labels:
            severity: warning
            pipeline: edge-tpu-anomaly-detection
          annotations:
            summary: "Google Coral Edge TPU Hardware Disconnected"
            description: "Edge TPU accelerator is unavailable or failed to initialize. The inference microservice is currently running in degraded CPU fallback mode."

        # Alert 3: Inference Latency SLA Breach (>2ms on Edge TPU)
        - alert: HighInferenceLatency
          expr: (rate(edge_tpu_inference_latency_seconds_sum[1m]) / rate(edge_tpu_inference_latency_seconds_count[1m])) > 0.002
          for: 2m
          labels:
            severity: warning
            pipeline: edge-tpu-anomaly-detection
          annotations:
            summary: "Edge TPU Inference Latency Exceeds 2ms SLA"
            description: "Average inference latency is {{ $value | printf \"%.4f\" }}s, exceeding the 2ms sub-millisecond edge requirement."
