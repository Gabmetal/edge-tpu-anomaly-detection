apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-agent
  namespace: anomaly-detection
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: telemetry-pipeline
    app.kubernetes.io/part-of: edge-ml-infrastructure
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: telemetry-pipeline
    spec:
      serviceAccountName: vector
      terminationGracePeriodSeconds: 15
      containers:
        - name: vector
          image: docker.io/timberio/vector:0.38.0-debian
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/vector/vector.yaml"
          env:
            - name: VECTOR_LOG
              value: "info"
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 514
              protocol: TCP
            - name: netflow-udp
              containerPort: 2055
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: var-log-audit
              mountPath: /var/log/kubernetes/audit
              readOnly: true
            - name: var-log-pods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          emptyDir: {}
        - name: var-log-audit
          hostPath:
            path: /var/log/kubernetes/audit
            type: DirectoryOrCreate
        - name: var-log-pods
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: anomaly-detection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-reader
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: anomaly-detection
