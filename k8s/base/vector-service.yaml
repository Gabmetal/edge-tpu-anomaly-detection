apiVersion: v1
kind: Service
metadata:
  name: vector-telemetry-ingress
  namespace: anomaly-detection
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: ingress
spec:
  type: LoadBalancer # Compatible with MetalLB or K3s Klipper LB; can be changed to NodePort
  selector:
    app.kubernetes.io/name: vector
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 514
      protocol: UDP
    - name: syslog-tcp
      port: 514
      targetPort: 514
      protocol: TCP
    - name: netflow-udp
      port: 2055
      targetPort: 2055
      protocol: UDP
